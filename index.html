
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uselessly Cheerful</title>
    <link rel="stylesheet" href="css/style.css">
    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: #333;
        }


        /* =========================
           DESKTOP
        ========================= */

        .desktop {
            width: 100vw;
            height: 100vh;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.8),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 70%,
                    rgba(255, 255, 255, 0.6),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #f8ddea,
                    #e8ddf8,
                    #dff3ef
                );
        }


        /* =========================
           TOP BAR
        ========================= */

        .desktop-header {
            width: 100%;
            height: 48px;

            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(255, 255, 255, 0.55);

            border-bottom:
                1px solid rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(10px);

            position: relative;
            z-index: 100;
        }


        .desktop-logo {
            font-size: 15px;
            font-weight: bold;
            color: #42384a;
        }


        .desktop-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .desktop-time {
            font-size: 13px;
            color: #555;
            min-width: 40px;
            text-align: right;
        }


        /* =========================
           SETTINGS BUTTON
        ========================= */

        .settings-button {
            width: 34px;
            height: 34px;

            border: none;
            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.75);

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                background 0.25s ease;
        }


        .settings-button:hover {
            transform: rotate(45deg);

            background:
                #f8ddea;
        }


        /* =========================
           DESKTOP ICONS
        ========================= */

        .desktop-icons {
            position: absolute;

            left: 25px;
            top: 75px;

            display: flex;
            flex-direction: column;

            gap: 18px;

            z-index: 100;
        }


        .desktop-icon {
            width: 110px;

            padding: 10px;

            border: none;
            border-radius: 12px;

            background: transparent;

            text-align: center;

            color: #444;

            font-size: 11px;

            font-family: inherit;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .desktop-icon:hover {
            background:
                rgba(255, 255, 255, 0.5);

            transform:
                scale(1.05);
        }


        .desktop-icon:active {
            transform:
                scale(0.95);
        }


        .desktop-icon div {
            font-size: 34px;
            margin-bottom: 7px;

            filter:
                drop-shadow(
                    0 3px 5px
                    rgba(0, 0, 0, 0.08)
                );
        }


        .desktop-icon span {
            display: block;

            text-shadow:
                0 1px 2px
                rgba(255, 255, 255, 0.8);
        }


        /* =========================
           MESSAGE POPUP
        ========================= */

        .message-popup {
            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.8);

            width:
                min(400px, 85vw);

            padding: 30px;

            background: white;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.25);

            border:
                1px solid #eee;

            opacity: 0;

            z-index: 5000;

            animation:
                popupIn 0.3s ease forwards;
        }


        .message-text {
            font-size: 19px;

            line-height: 1.5;

            color: #403846;

            margin: 0;
        }


        .message-close {
            margin-top: 20px;

            padding:
                9px 22px;

            border: none;

            border-radius: 10px;

            background:
                #42384a;

            color: white;

            font-size: 13px;

            cursor: pointer;

            transition:
                transform 0.2s ease;
        }


        .message-close:hover {
            transform:
                scale(1.05);
        }


        @keyframes popupIn {

            from {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.8);
            }

            to {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }


        .message-popup.hide {
            animation:
                popupOut 0.3s ease forwards;
        }


        @keyframes popupOut {

            from {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            to {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.8);
            }
        }


        /* =========================
           SETTINGS OVERLAY
        ========================= */

        .settings-overlay {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(30, 20, 40, 0.25);

            backdrop-filter:
                blur(5px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            z-index: 4000;
        }


        .settings-overlay.open {
            opacity: 1;
            visibility: visible;
        }


        /* =========================
           SETTINGS PANEL
        ========================= */

        .settings-panel {
            width:
                min(450px, 90vw);

            padding: 25px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.2);

            transform:
                translateY(15px)
                scale(0.96);

            transition:
                transform 0.25s ease;
        }


        .settings-overlay.open
        .settings-panel {
            transform:
                translateY(0)
                scale(1);
        }


        /* =========================
           SETTINGS HEADER
        ========================= */

        .settings-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;
        }


        .settings-header > div {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .settings-icon {
            font-size: 21px;
        }


        .settings-header h2 {
            font-size: 21px;
        }


        .close-settings {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 8px;

            background:
                #f4f4f4;

            font-size: 22px;

            cursor: pointer;

            color: #666;
        }


        .close-settings:hover {
            background:
                #eee;
        }


        .settings-subtitle {
            font-size: 13px;

            line-height: 1.5;

            color: #777;

            margin-bottom: 25px;
        }


        /* =========================
           MOOD SECTION
        ========================= */

        .setting-section h3 {
            font-size: 14px;

            margin-bottom: 12px;

            color: #555;
        }


        .mood-options {
            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .mood-option {
            width: 100%;

            padding:
                12px 14px;

            display: flex;

            align-items: center;

            gap: 13px;

            border:
                1px solid #e5e5e5;

            border-radius: 12px;

            background: white;

            text-align: left;

            cursor: pointer;

            font-family: inherit;

            transition:
                background 0.2s ease,
                border 0.2s ease,
                transform 0.2s ease;
        }


        .mood-option:hover {
            background:
                #fafafa;

            transform:
                translateX(2px);
        }


        .mood-icon {
            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                #f7f4f7;

            font-size: 21px;
        }


        .mood-info {
            display: flex;

            flex-direction: column;

            gap: 3px;

            flex: 1;
        }


        .mood-info strong {
            font-size: 14px;

            color: #333;
        }


        .mood-info small {
            font-size: 11px;

            color: #888;
        }


        .selection {
            opacity: 0;

            font-size: 17px;

            color: #c67d99;
        }


        .mood-option.active {
            border-color:
                #e5a5bb;

            background:
                #fff3f7;
        }


        .mood-option.active
        .selection {
            opacity: 1;
        }


        .settings-footer {
            margin-top: 22px;

            padding-top: 16px;

            border-top:
                1px solid #eee;

            text-align: center;

            font-size: 11px;

            color: #999;
        }


        /* =========================
           MOUSE GARDEN
        ========================= */

        .garden-object {
            position: fixed;

            pointer-events: none;

            z-index: 3000;

            font-size: 22px;

            animation:
                gardenFloat 2s ease-out forwards;
        }


        @keyframes gardenFloat {

            0% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0.5)
                    rotate(0deg);
            }

            50% {
                opacity: 1;

                transform:
                    translate(-50%, -70px)
                    scale(1)
                    rotate(20deg);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -110px)
                    scale(0.7)
                    rotate(45deg);
            }
        }


        /* =========================
           TASKBAR
        ========================= */

        .taskbar {
            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 50px;

            display: flex;

            align-items: center;

            padding: 0 15px;

            gap: 15px;

            background:
                rgba(255, 255, 255, 0.7);

            backdrop-filter:
                blur(12px);

            border-top:
                1px solid
                rgba(255, 255, 255, 0.8);

            z-index: 100;
        }


        .taskbar-start {
            font-size: 23px;
        }


        .taskbar-title {
            padding:
                7px 15px;

            border-radius: 8px;

            background:
                rgba(255, 255, 255, 0.8);

            font-size: 12px;
        }


        .taskbar-status {
            margin-left: auto;

            font-size: 11px;

            color: #777;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .desktop-icons {
                left: 10px;
            }

            .desktop-icon {
                width: 90px;
            }

            .taskbar-status {
                display: none;
            }

            .desktop-logo {
                font-size: 13px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================================
         DESKTOP
    ====================================================== -->

    <div class="desktop">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <div class="desktop-header">

            <div class="desktop-logo">
                Uselessly Cheerful
            </div>


            <div class="desktop-controls">

                <!-- SETTINGS -->

                <button
                    class="settings-button"
                    id="settingsButton"
                    title="Settings"
                >
                    ⚙
                </button>


                <!-- CLOCK -->

                <div
                    class="desktop-time"
                    id="desktopTime"
                >
                    00:00
                </div>

            </div>

        </div>

        <!-- =================================================
             DESKTOP ICONS
        ================================================== -->

        <div class="desktop-icons">


            <!-- =================================================
                 CHEERFULNESS MESSAGE ICON
            ================================================== -->

            <button
                class="desktop-icon"
                id="cheerfulnessIcon"
            >

                <div>
                    🌸
                </div>

                <span>
                    Cheerfulness
                </span>

            </button>


            <!-- =================================================
                 FAKE FOLDER
            ================================================== -->

            <button
                class="desktop-icon"
                id="importantFolder"
            >

                <div>
                    📁
                </div>

                <span>
                    Definitely Important
                </span>

            </button>


            <!-- =================================================
                 FAKE FILE
            ================================================== -->

            <button
                class="desktop-icon"
                id="uselessFiles"
            >

                <div>
                    💾
                </div>

                <span>
                    Useless Files
                </span>

            </button>


        </div>


        <!-- =================================================
             SETTINGS OVERLAY
        ================================================== -->

        <div
            class="settings-overlay"
            id="settingsOverlay"
        >


            <div class="settings-panel">


                <!-- SETTINGS HEADER -->

                <div class="settings-header">

                    <div>

                        <span
                            class="settings-icon"
                        >
                            ⚙
                        </span>

                        <h2>
                            Settings
                        </h2>

                    </div>


                    <button
                        class="close-settings"
                        id="closeSettings"
                    >
                        ×
                    </button>

                </div>


                <!-- SETTINGS DESCRIPTION -->

                <p class="settings-subtitle">

                    Choose the emotional state of this
                    completely unnecessary application.

                </p>


                <!-- MOOD SELECTION -->

                <div class="setting-section">

                    <h3>
                        Select Mood
                    </h3>


                    <div class="mood-options">


                        <!-- HAPPY -->

                        <button
                            class="mood-option active"
                            data-mood="happy"
                        >

                            <div class="mood-icon">
                                😊
                            </div>


                            <div class="mood-info">

                                <strong>
                                    Happy
                                </strong>

                                <small>
                                    Wholesome and positive
                                </small>

                            </div>


                            <span class="selection">
                                ✓
                            </span>

                        </button>


                        <!-- SAD -->

                        <button
                            class="mood-option"
                            data-mood="sad"
                        >

                            <div class="mood-icon">
                                😭
                            </div>


                            <div class="mood-info">

                                <strong>
                                    Sad
                                </strong>

                                <small>
                                    Dramatic but somehow funny
                                </small>

                            </div>


                            <span class="selection">
                                ✓
                            </span>

                        </button>


                        <!-- SAVAGE -->

                        <button
                            class="mood-option"
                            data-mood="savage"
                        >

                            <div class="mood-icon">
                                😈
                            </div>


                            <div class="mood-info">

                                <strong>
                                    Savage
                                </strong>

                                <small>
                                    Playful roasts
                                </small>

                            </div>


                            <span class="selection">
                                ✓
                            </span>

                        </button>


                        <!-- CHAOTIC -->

                        <button
                            class="mood-option"
                            data-mood="chaotic"
                        >

                            <div class="mood-icon">
                                🤪
                            </div>


                            <div class="mood-info">

                                <strong>
                                    Chaotic
                                </strong>

                                <small>
                                    Absolutely no explanation
                                </small>

                            </div>


                            <span class="selection">
                                ✓
                            </span>

                        </button>


                    </div>

                </div>


                <!-- SETTINGS FOOTER -->

                <div class="settings-footer">

                    Changing the mood serves absolutely
                    no practical purpose.

                </div>


            </div>

        </div>


        <!-- =================================================
             TASKBAR
        ================================================== -->

        <div class="taskbar">

            <div class="taskbar-start">
                🌸
            </div>


            <div class="taskbar-title">
                Uselessly Cheerful
            </div>


            <div class="taskbar-status">
                Everything is working unnecessarily.
            </div>

        </div>

        <button id="sound-toggle-btn" class="floating-sound-btn" title="Toggle Sound">🔊</button>
        <script type="module" src="js/main.js"></script>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           MESSAGE DATA
        ====================================================== */

        const messages = {


            /* =========================
               HAPPY
            ========================= */

            happy: [

                "You're doing great. Probably.",

                "A flower somewhere is proud of you.",

                "You are officially allowed to have a good day.",

                "You survived another day. Achievement unlocked!",

                "Someone out there thinks you're awesome.",

                "Your existence has been approved.",

                "You deserve a tiny celebration.",

                "Today looks suspiciously good on you.",

                "You are 100% certified adorable.",

                "The universe is slightly better because you're here."

            ],


            /* =========================
               SAD
            ========================= */

            sad: [

                "Everything is fine. Probably. Maybe.",

                "Even your Wi-Fi has more connection than you.",

                "Sometimes you just need to stare at the ceiling dramatically.",

                "Your problems have been acknowledged by absolutely nobody.",

                "It's okay. Crying is just your face updating.",

                "The clouds understand you.",

                "Today has the emotional energy of a rainy Monday.",

                "You are sad, but at least you're aesthetically sad.",

                "Perhaps staring into the distance will solve everything.",

                "Your imaginary therapist is proud of you."

            ],


            /* =========================
               SAVAGE
            ========================= */

            savage: [

                "You're not useless. You are just aggressively unnecessary.",

                "Your brain has entered airplane mode.",

                "Congratulations! You almost made a good decision.",

                "You're doing amazing... compared to a potato.",

                "Don't worry. Nobody expected much.",

                "Your productivity called. It wants a refund.",

                "You have unlimited potential. Unfortunately, you're not using it.",

                "That was certainly a decision.",

                "Even autocorrect gives up on you sometimes.",

                "Your motivation has officially left the group chat."

            ],


            /* =========================
               CHAOTIC
            ========================= */

            chaotic: [

                "THE FLOWERS HAVE AWAKENED.",

                "Your left sock knows too much.",

                "QUICK! Pretend you're productive!",

                "A suspiciously confident butterfly is judging you.",

                "Banana protocol activated.",

                "The universe has no idea what you're doing.",

                "ERROR 404: PURPOSE NOT FOUND.",

                "You have been selected for absolutely nothing.",

                "THE CEILING IS WATCHING.",

                "Congratulations. You are now part of the problem."

            ]

        };


        /* =====================================================
           CURRENT MOOD
        ====================================================== */

        let currentMood = "happy";


        /* =====================================================
           GET ELEMENTS
        ====================================================== */

        const cheerfulnessIcon =
            document.getElementById(
                "cheerfulnessIcon"
            );


        const settingsButton =
            document.getElementById(
                "settingsButton"
            );


        const closeSettings =
            document.getElementById(
                "closeSettings"
            );


        const settingsOverlay =
            document.getElementById(
                "settingsOverlay"
            );


        const moodOptions =
            document.querySelectorAll(
                ".mood-option"
            );


        const desktopTime =
            document.getElementById(
                "desktopTime"
            );


        /* =====================================================
           GET RANDOM MESSAGE
        ====================================================== */

        function getRandomMessage() {

            const moodMessages =
                messages[currentMood] ||
                messages.happy;


            const randomIndex =
                Math.floor(
                    Math.random() *
                    moodMessages.length
                );


            return moodMessages[
                randomIndex
            ];

        }


        /* =====================================================
           SHOW MESSAGE
        ====================================================== */

        function showMessage() {

            const message =
                getRandomMessage();


            const popup =
                document.createElement(
                    "div"
                );


            popup.className =
                "message-popup";


            const text =
                document.createElement(
                    "p"
                );


            text.className =
                "message-text";


            text.textContent =
                message;


            const closeButton =
                document.createElement(
                    "button"
                );


            closeButton.className =
                "message-close";


            closeButton.textContent =
                "Okay";


            popup.appendChild(
                text
            );


            popup.appendChild(
                closeButton
            );


            document.body.appendChild(
                popup
            );


            /* =========================
               CLOSE MESSAGE
            ========================= */

            closeButton.addEventListener(
                "click",
                () => {

                    popup.classList.add(
                        "hide"
                    );


                    setTimeout(
                        () => {

                            popup.remove();

                        },
                        300
                    );

                }
            );

        }


        /* =====================================================
           CLICK CHEERFULNESS ICON
        ====================================================== */

        cheerfulnessIcon.addEventListener(
            "click",
            showMessage
        );


        /* =====================================================
           OPEN SETTINGS
        ====================================================== */

        settingsButton.addEventListener(
            "click",
            () => {

                settingsOverlay.classList.add(
                    "open"
                );

            }
        );


        /* =====================================================
           CLOSE SETTINGS
        ====================================================== */

        closeSettings.addEventListener(
            "click",
            () => {

                settingsOverlay.classList.remove(
                    "open"
                );

            }
        );


        /* =====================================================
           CLICK OUTSIDE SETTINGS
        ====================================================== */

        settingsOverlay.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    settingsOverlay
                ) {

                    settingsOverlay.classList.remove(
                        "open"
                    );

                }

            }
        );


        /* =====================================================
           MOOD SELECTION
        ====================================================== */

        moodOptions.forEach(
            (option) => {

                option.addEventListener(
                    "click",
                    () => {


                        /* Remove active */

                        moodOptions.forEach(
                            (item) => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                        /* Add active */

                        option.classList.add(
                            "active"
                        );


                        /* Save mood */

                        currentMood =
                            option.dataset.mood;


                        /* Close settings */

                        settingsOverlay.classList.remove(
                            "open"
                        );

                    }
                );

            }
        );


        /* =====================================================
           CLOCK
        ====================================================== */

        function updateClock() {

            const now =
                new Date();


            const hours =
                String(
                    now.getHours()
                ).padStart(
                    2,
                    "0"
                );


            const minutes =
                String(
                    now.getMinutes()
                ).padStart(
                    2,
                    "0"
                );


            desktopTime.textContent =
                `${hours}:${minutes}`;

        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           MOUSE GARDEN
        ====================================================== */

        const gardenObjects = [

            "🌸",
            "🌼",
            "🌻",
            "🌷",
            "🌺",
            "✨",
            "⭐",
            "🍃",
            "🦋"

        ];


        let mouseGardenEnabled =
            true;


        let lastMouseX = 0;

        let lastMouseY = 0;


        /* =====================================================
           MOUSE MOVEMENT
        ====================================================== */

        document.addEventListener(
            "mousemove",
            (event) => {


                if (
                    !mouseGardenEnabled
                ) {
                    return;
                }


                const distance =
                    Math.sqrt(

                        Math.pow(
                            event.clientX -
                            lastMouseX,
                            2
                        )

                        +

                        Math.pow(
                            event.clientY -
                            lastMouseY,
                            2
                        )

                    );


                /*
                   Prevent too many
                   objects from spawning.
                */

                if (
                    distance < 80
                ) {

                    return;

                }


                lastMouseX =
                    event.clientX;


                lastMouseY =
                    event.clientY;


                createGardenObject(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =====================================================
           CREATE GARDEN OBJECT
        ====================================================== */

        function createGardenObject(
            x,
            y
        ) {

            const object =
                document.createElement(
                    "div"
                );


            object.className =
                "garden-object";


            const randomIndex =
                Math.floor(
                    Math.random() *
                    gardenObjects.length
                );


            object.textContent =
                gardenObjects[
                    randomIndex
                ];


            object.style.left =
                x + "px";


            object.style.top =
                y + "px";


            document.body.appendChild(
                object
            );


            /* Remove after animation */

            setTimeout(
                () => {

                    object.remove();

                },
                2000
            );

        }


        /* =====================================================
           KEYBOARD SHORTCUTS
        ====================================================== */

        document.addEventListener(
            "keydown",
            (event) => {


                /* M = random message */

                if (
                    event.key.toLowerCase() ===
                    "m"
                ) {

                    showMessage();

                }


                /* ESC = close settings/message */

                if (
                    event.key ===
                    "Escape"
                ) {


                    settingsOverlay.classList.remove(
                        "open"
                    );


                    const popup =
                        document.querySelector(
                            ".message-popup"
                        );


                    if (popup) {

                        popup.classList.add(
                            "hide"
                        );


                        setTimeout(
                            () => {

                                popup.remove();

                            },
                            300
                        );

                    }

                }

            }
        );


        /* =====================================================
           FAKE ICONS
        ====================================================== */

        const importantFolder =
            document.getElementById(
                "importantFolder"
            );


        const uselessFiles =
            document.getElementById(
                "uselessFiles"
            );


        importantFolder.addEventListener(
            "click",
            () => {

                showFakeNotification(
                    "📁",
                    "There is absolutely nothing important here."
                );

            }
        );


        uselessFiles.addEventListener(
            "click",
            () => {

                showFakeNotification(
                    "💾",
                    "Congratulations. You found useless files."
                );

            }
        );


        /* =====================================================
           FAKE NOTIFICATION
        ====================================================== */

        function showFakeNotification(
            icon,
            message
        ) {

            const notification =
                document.createElement(
                    "div"
                );


            notification.style.position =
                "fixed";


            notification.style.right =
                "20px";


            notification.style.bottom =
                "70px";


            notification.style.padding =
                "14px 18px";


            notification.style.background =
                "rgba(255,255,255,0.95)";


            notification.style.borderRadius =
                "12px";


            notification.style.boxShadow =
                "0 10px 30px rgba(0,0,0,0.15)";


            notification.style.fontSize =
                "13px";


            notification.style.zIndex =
                "4500";


            notification.textContent =
                `${icon} ${message}`;


            document.body.appendChild(
                notification
            );


            setTimeout(
                () => {

                    notification.remove();

                },
                2500
            );

        }

    </script>

</body>

</html>
